# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0
    - name: Restore dependencies
      run: |
        dotnet restore SupercellProxy.Keys/SupercellProxy.Keys.csproj
        dotnet restore SupercellProxy.Networking/SupercellProxy.Networking.csproj
    - name: Build
      run: |
        dotnet build SupercellProxy.Keys/SupercellProxy.Keys.csproj --no-restore
        dotnet build SupercellProxy.Networking/SupercellProxy.Networking.csproj --no-restore
    - name: Test
      run: |
        dotnet test SupercellProxy.Keys/SupercellProxy.Keys.csproj --no-build --verbosity normal
        dotnet test SupercellProxy.Networking/SupercellProxy.Networking.csproj --no-build --verbosity normal
